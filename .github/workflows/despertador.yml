name: Navegador Fantasma (Despertador)

on:
  schedule:
    # Cada 6 horas (más margen que 1 vez al día, por si alguna ejecución falla).
    - cron: '0 */6 * * *'
  workflow_dispatch: # Botón para ejecutarlo manualmente desde la pestaña Actions

jobs:
  despertar-app:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Puppeteer
        run: npm install puppeteer

      - name: Visitar y despertar la app
        run: node .github/scripts/despertar.js
